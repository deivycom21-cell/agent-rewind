[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-rewind"
version = "0.1.0"
description = "Atomic Time Machine for AI Coding Agents — shadow-git snapshots without touching your real history"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["agent", "git", "undo", "snapshot", "ai", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "rich>=13.0.0",
    "watchfiles>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
agent-rewind = "agent_rewind.cli:main"

[project.urls]
Homepage = "https://github.com/buildwithcrow/agent-rewind"
Repository = "https://github.com/buildwithcrow/agent-rewind"
Issues = "https://github.com/buildwithcrow/agent-rewind/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_rewind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
